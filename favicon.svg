<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded square -->
  <rect width="64" height="64" rx="14" fill="#18181b"/>

  <!-- Brush handle — thick diagonal line top-right to bottom-left -->
  <line x1="48" y1="10" x2="24" y2="38" stroke="#f4f4f5" stroke-width="7" stroke-linecap="round"/>

  <!-- Brush ferrule (metal band) -->
  <line x1="26" y1="36" x2="22" y2="40" stroke="#a1a1aa" stroke-width="9" stroke-linecap="round"/>

  <!-- Brush tip / bristles — orange wedge -->
  <polygon points="20,42 10,52 14,56 26,46" fill="#f97316"/>
  <!-- Highlight on bristles -->
  <polygon points="20,42 12,50 14,52 22,44" fill="#fb923c" opacity="0.6"/>

  <!-- Small paint dot accent -->
  <circle cx="50" cy="14" r="4" fill="#f97316"/>
</svg>
