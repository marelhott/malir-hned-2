const MONTH_NAMES = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
function dayLbl(mIdx, d) { const m = MONTHS[mIdx]; return `${d}. ${MONTH_NAMES[m.month-1]} ${m.year}`; }

function getPainterSlots(painterName) {
  const slots = [];
  MONTHS.forEach((month, mIdx) => {
    month.cal.forEach(day => {
      day.jobs.forEach((job, i) => {
        if (job.p === painterName) {
          slots.push({ id: `${mIdx}-${day.d}-${i}`, mIdx, day: day.d, time: job.t, monthLabel: month.label });
        }
      });
    });
  });
  return slots;
}

// ── MODAL VÝBĚRU TERMÍNU ──────────────────────────────────────
function SlotPickerModal({ painter, onClose }) {
  const [selSlot, setSelSlot] = useState(null);
  const slots = useMemo(() => getPainterSlots(painter.name), [painter.name]);

  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, []);

  function handleConfirm() {
    if (!selSlot) return;
    localStorage.setItem('mh_selected_slot', JSON.stringify({
      monthIdx: selSlot.mIdx, day: selSlot.day, slotId: selSlot.id,
    }));
    localStorage.setItem('mh_selected_slot_payload', JSON.stringify({
      id: selSlot.id,
      monthIdx: selSlot.mIdx,
      day: selSlot.day,
      time: selSlot.time,
      painter,
      priceRange: { low: 0, high: 0, single: true },
    }));
    window.location.href = 'Malir Hned v2.html#terminy';
  }

  // Group slots by month
  const byMonth = MONTHS.map((m, mIdx) => ({
    label: m.label,
    slots: slots.filter(s => s.mIdx === mIdx),
  })).filter(g => g.slots.length > 0);

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 200, background: 'rgba(12,10,6,0.54)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: T.surface, borderRadius: T.r, boxShadow: T.panelShadow, maxWidth: 620, width: '100%', maxHeight: '88vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        {/* Header */}
        <div style={{ padding: '20px 28px', borderBottom: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 600, color: T.accent, textTransform: 'uppercase', letterSpacing: '0.09em', marginBottom: 4 }}>Vybrat termín</div>
            <h2 style={{ fontSize: 20, fontWeight: 500, color: T.text, letterSpacing: '-0.04em', margin: 0 }}>{painter.name}</h2>
            <p style={{ fontSize: 13, fontWeight: 300, color: T.textMid, marginTop: 2 }}>{painter.role}</p>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 52, height: 52, borderRadius: 14, overflow: 'hidden', border: `1px solid ${T.border}` }}>
              <img src={painter.img} alt={painter.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
            <button type="button" onClick={onClose} style={{ width: 34, height: 34, borderRadius: 9, border: `1px solid ${T.border}`, background: '#f7f4f0', fontSize: 16, color: T.textMid, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
          </div>
        </div>

        {/* Sloty */}
        <div style={{ overflow: 'auto', padding: '20px 28px', flex: 1 }}>
          {byMonth.map(group => (
            <div key={group.label} style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.textMid, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 12 }}>{group.label}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {group.slots.map(slot => {
                  const active = selSlot?.id === slot.id;
                  return (
                    <button key={slot.id} type="button" onClick={() => setSelSlot(slot)}
                      style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', borderRadius: T.cr, border: `1.5px solid ${active ? T.accent : T.border}`, background: active ? T.accentSoft : '#fafaf7', cursor: 'pointer', fontFamily: "'Outfit', sans-serif", transition: 'all 0.15s' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <div style={{ width: 8, height: 8, borderRadius: 99, background: active ? T.accent : '#40b870', flexShrink: 0 }} />
                        <span style={{ fontSize: 15, fontWeight: 500, color: active ? T.accent : T.text }}>{dayLbl(slot.mIdx, slot.day)}</span>
                      </div>
                      <span style={{ fontSize: 14, fontWeight: 300, color: active ? T.accent : T.textMid }}>{slot.time}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
          {slots.length === 0 && (
            <p style={{ fontSize: 14, fontWeight: 300, color: T.textMid, textAlign: 'center', padding: '32px 0' }}>Pro tohoto malíře nejsou aktuálně dostupné termíny.</p>

        </div>

        {/* Footer */}
        <div style={{ padding: '16px 28px', borderTop: `1px solid ${T.border}`, flexShrink: 0, display: 'flex', gap: 10 }}>
          <button type="button" onClick={onClose} style={{ flex: 1, padding: '12px', borderRadius: T.br, border: `1px solid ${T.border}`, background: T.surface, fontSize: 14, fontWeight: 300, color: T.textMid, cursor: 'pointer', fontFamily: "'Outfit', sans-serif" }}>Zrušit</button>

            style={{ flex: 2, padding: '12px', borderRadius: T.br, background: selSlot ? T.accent : '#cdc8c0', color: '#fff', fontSize: 14, fontWeight: 400, cursor: selSlot ? 'pointer' : 'default', fontFamily: "'Outfit', sans-serif", border: 'none', boxShadow: selSlot ? `0 8px 20px ${T.accentShadow}` : 'none', transition: 'all 0.2s' }}>

          </button>
        </div>
      </div>
    </div>
  );
}

function PainterCard({ painter, onBook }) {

        {/* Dostupnost */}
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 10px', borderRadius: 99, background: availColor.bg, fontSize: 11, fontWeight: 400, color: availColor.color, marginBottom: 14, alignSelf: 'flex-start' }}>
          <div style={{ width: 5, height: 5, borderRadius: 99, background: availColor.dot }} />
          {painter.availLabel}
        </div>
        <div style={{ fontSize: 19, fontWeight: 500, color: T.text, letterSpacing: '-0.04em', marginBottom: 4 }}>{painter.name}</div>
        <div style={{ fontSize: 13, fontWeight: 300, color: T.textMid, marginBottom: 12 }}>{painter.role}</div>
        <p style={{ fontSize: 13, fontWeight: 300, color: T.textMid, lineHeight: 1.65, marginBottom: 16, flex: 1 }}>{painter.bio}</p>
        {/* Tagy */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 16 }}>
          {painter.spec.map(s => (
            <span key={s} style={{ padding: '4px 10px', borderRadius: 99, background: T.accentSoft, fontSize: 11, fontWeight: 400, color: T.accent }}>{s}</span>
          ))}
        </div>
        {/* Stats */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', marginBottom: 16, border: `1px solid ${T.border}`, borderRadius: 12, overflow: 'hidden' }}>
          {[['Praxe', painter.exp], ['Zakázky', painter.jobs], ['Reakce', painter.resp]].map(([lbl, val], i) => (
            <div key={lbl} style={{ padding: '10px 10px', textAlign: 'center', borderRight: i < 2 ? `1px solid ${T.border}` : 'none' }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: T.text }}>{val}</div>
              <div style={{ fontSize: 10, fontWeight: 300, color: T.textLight, marginTop: 2 }}>{lbl}</div>
            </div>
          ))}
        </div>
        {/* Akce */}
        <button type="button" onClick={() => onBook(painter)}
          style={{ width: '100%', padding: '12px', borderRadius: T.br, background: T.accent, color: '#fff', fontSize: 14, fontWeight: 400, cursor: 'pointer', fontFamily: "'Outfit', sans-serif", border: 'none', boxShadow: `0 6px 16px ${T.accentShadow}` }}>
          Vybrat termín u {painter.name.split(' ')[0]}
        </button>
      </div>
    </div>
  );
}
